name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit + architecture tests (surefire), then integration tests (failsafe, Testcontainers uses the runner's
      # Docker daemon for Postgres, Redis, Kafka, Mailpit and S3).
      - name: Verify
        run: mvn -B -ntp verify
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The code base has pre-existing lint errors (unused variables). Reported, not gating, until cleaned up.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      # up.sh writes fresh secrets here; the file stays on the runner and is never printed.
      PLATFORM_ENV_FILE: /tmp/platform-ci.env
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the full stack
        run: WAIT=420 ./scripts/up.sh
      - name: Scan backend image
        # Pinned by commit: earlier trivy-action tags were hijacked in March 2026.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: insurai-platform:local
          version: v0.69.3
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          ignore-unfixed: true
          exit-code: '1'
      - name: End-to-end demo and benchmark
        run: |
          ./scripts/demo.sh
          POLICIES=100 QUERIES=200 ./scripts/bench.sh
      - name: Compose logs
        if: failure()
        run: docker compose --env-file "$PLATFORM_ENV_FILE" logs --tail 200 || true
      - name: Tear down
        if: always()
        run: test -f "$PLATFORM_ENV_FILE" && docker compose --env-file "$PLATFORM_ENV_FILE" down -v || true
