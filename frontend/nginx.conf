server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every other path is the single-page app. (The API is on a different origin, so none
    # of the app's routes - /admin/login, /hr/dashboard, ... - collide with backend routes.)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
