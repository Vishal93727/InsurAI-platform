global:
  scrape_interval: 15s
  # Faster than the scrape interval so an alert is not delayed by evaluation cadence.
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: insurai-platform
    metrics_path: /actuator/prometheus
    static_configs:
      # In the compose stack the backend is reachable by service name.
      - targets: ["backend:8080"]
      # Backend run from an IDE on the host (Docker Desktop resolves host.docker.internal). This target shows as
      # DOWN when you use the containerised backend, which is expected.
      - targets: ["host.docker.internal:8080"]
        labels:
          mode: host
